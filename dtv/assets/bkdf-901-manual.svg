<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Sony BKDF-901 1M/E Control Panel</title>
<desc id="d">Geometria vetorial reconstruída a partir dos desenhos técnicos das páginas 13 a 19 do manual Sony DFS-900M, com cores ajustadas a partir de referência fotográfica do BKDF-901.</desc>
<defs>
 <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9aa0ad"/><stop offset=".5" stop-color="#858b99"/><stop offset="1" stop-color="#737986"/></linearGradient>
 <linearGradient id="key" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8f8f4"/><stop offset=".55" stop-color="#dfdfd8"/><stop offset="1" stop-color="#c8c9c3"/></linearGradient>
 <linearGradient id="greenKey" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e7f1de"/><stop offset="1" stop-color="#bad2ae"/></linearGradient>
 <linearGradient id="pinkKey" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5dada"/><stop offset="1" stop-color="#dfa9ad"/></linearGradient>
 <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3c4149"/><stop offset="1" stop-color="#1b1e23"/></linearGradient>
 <radialGradient id="knob"><stop stop-color="#555b64"/><stop offset=".62" stop-color="#23272d"/><stop offset="1" stop-color="#08090b"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".35"/></filter>
</defs>
<style>
.txt{font-family:Arial,Helvetica,sans-serif;fill:#23262b;font-weight:700;text-anchor:middle}.micro{font-size:8px}.tiny{font-size:10px}.small{font-size:12px}
.key{fill:url(#key);stroke:#646a72;stroke-width:1.2}.gkey{fill:url(#greenKey);stroke:#768670;stroke-width:1.2}.pkey{fill:url(#pinkKey);stroke:#996f74;stroke-width:1.2}.dk{fill:url(#dark);stroke:#111318;stroke-width:1.5}.line{fill:none;stroke:#545a62;stroke-width:1.3}.led{fill:#d9f43d;filter:drop-shadow(0 0 4px #d9f43d)}
</style>
<g filter="url(#shadow)">
<rect x="20" y="28" width="1160" height="464" rx="22" fill="url(#body)" stroke="#545963" stroke-width="3"/>
<rect x="32" y="40" width="1136" height="440" rx="14" fill="none" stroke="#aeb2ba" stroke-opacity=".55"/>
</g>
<text x="72" y="63" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" fill="#eef0f2">SONY</text>

<!-- External connections / power -->
<g>
<rect x="46" y="80" width="100" height="170" rx="6" fill="#7a808c" stroke="#585e67"/>
<rect class="dk" x="60" y="96" width="70" height="26" rx="3"/><text class="txt micro" x="95" y="113" fill="#f4f4f1">USB MEMORY</text>
<rect class="key" x="67" y="136" width="56" height="30" rx="4"/><text class="txt micro" x="95" y="155">EDITOR</text>
<rect class="key" x="67" y="174" width="56" height="30" rx="4"/><text class="txt micro" x="95" y="193">GPI</text>
<rect class="pkey" x="67" y="212" width="56" height="25" rx="4"/><text class="txt micro" x="95" y="228">SHUTDOWN</text>
</g>

