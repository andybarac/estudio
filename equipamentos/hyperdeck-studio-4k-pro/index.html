<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperDeck Studio 4K Pro — painel frontal interativo</title><style>
:root{--bg:#0f1317;--card:#20262d;--text:#f4f6f7;--muted:#adb5bd;--accent:#64a8ff;--red:#ef4444;--green:#22c55e;--orange:#f59e0b;--blue:#1f78c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif}main{max-width:1180px;margin:auto;padding:18px}.muted{color:var(--muted);line-height:1.6}.frame{overflow-x:auto;border:1px solid #3c444c;border-radius:14px;padding:12px;background:#12171b}svg{width:100%;min-width:950px}.spot{cursor:pointer}.hit{fill:transparent;stroke:transparent;stroke-width:2}.spot.sel .hit{stroke:var(--accent);fill:#173451;fill-opacity:.2}.glow{fill:none;stroke-width:4}.off{stroke:transparent}.rec{stroke:var(--red);filter:drop-shadow(0 0 4px var(--red))}.play{stroke:var(--green);filter:drop-shadow(0 0 4px var(--green))}.bad{stroke:var(--orange);filter:drop-shadow(0 0 4px var(--orange))}.lesson{margin-top:14px;background:var(--card);border:1px solid #3c444c;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}.sim{border:1px solid #4a545d;background:transparent;color:var(--text);padding:9px 12px;border-radius:8px;margin:6px 6px 0 0;cursor:pointer}.sim.active{border-color:var(--accent);background:#173451}.feedback{margin-top:12px;padding:12px;background:#171c21;border-radius:9px;line-height:1.55}.status{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;color:var(--muted);font-size:13px}.status span{border:1px solid #3c444c;padding:4px 8px;border-radius:99px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:12px}}</style></head><body><main>

<div class="status"><span id="deck">Estado — parado</span><span id="inp">Entrada — SDI</span><span id="media">Mídia — SSD 1</span><span id="mode">Busca — JOG</span></div>
<section class="lesson"><h2 id="title">Controles de transporte</h2><div id="term" class="muted">(REC / PLAY / STOP / SKIP)</div><div class="grid"><div><div class="ey">Como funciona</div><p id="func"></p></div><div><div class="ey">Exemplo de uso</div><p id="ex"></p></div></div><div class="ey">Experimente</div><div id="buttons"></div><div id="feedback" class="feedback"></div></section>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let input='SDI',media='SSD 1',mode='JOG',frames=0,angle=0,timer=null;const fps=30;
const tc=()=>{let f=frames%fps,s=Math.floor(frames/fps)%60,m=Math.floor(frames/(fps*60))%60,h=Math.floor(frames/(fps*3600));return [h,m,s,f].map(v=>String(v).padStart(2,'0')).join(':')};const upd=()=>$('#tc').textContent=tc();const stopTimer=()=>{if(timer){clearInterval(timer);timer=null}};
const glow=(id,c)=>$(id).setAttribute('class','glow '+c);const clear=()=>['#g1','#g2','#gsd'].forEach(x=>glow(x,'off'));const active=c=>{clear();glow(media==='SSD 1'?'#g1':media==='SSD 2'?'#g2':'#gsd',c)};
function deck(s){$('#deck').textContent='Estado — '+s}function stop(){stopTimer();deck('parado');$('#stat').textContent='■';$('#stat').setAttribute('fill','#aaa');clear()}function rec(){stopTimer();deck('gravando');$('#stat').textContent='●';$('#stat').setAttribute('fill','#ef4444');active('rec');timer=setInterval(()=>{frames++;upd()},34)}function play(){stopTimer();deck('reproduzindo');$('#stat').textContent='▶';$('#stat').setAttribute('fill','#22c55e');active('play');timer=setInterval(()=>{frames++;upd()},34)}
function setInput(v){input=v;$('#inp').textContent='Entrada — '+v;$('#preview').textContent='INPUT '+v}function setMedia(v){media=v;$('#media').textContent='Mídia — '+v;$('#med').textContent=v;clear()}function setMode(v){mode=v;$('#mode').textContent='Busca — '+v;['#stl','#jog','#scr'].forEach(x=>$(x).setAttribute('fill','#191d21'));$(v==='STL'?'#stl':v==='SCR'?'#scr':'#jog').setAttribute('fill','#34495e')}
const L={
transport:{t:'Controles de transporte',term:'REC / PLAY / STOP / SKIP',f:'Esses botões controlam gravação, reprodução, parada e navegação entre clipes.',e:'Para gravar um programa, confira a entrada e a mídia e pressione REC. Para conferir um VT, localize o clipe e pressione PLAY. Use STOP para estacionar o deck no ponto atual.',a:[['Gravar',rec],['Reproduzir',play],['Parar',stop],['Próximo clipe',()=>{$('#preview').textContent='CLIP 002'}]]},
ssd1:{t:'Compartimento SSD 1',term:'SSD 2,5 polegadas',f:'O SSD pode armazenar gravações e arquivos para reprodução. O contorno luminoso informa o estado da mídia.',e:'Depois de inserir o SSD, o indicador fica verde enquanto ele é verificado e depois apaga. Fica vermelho na gravação, verde na reprodução e laranja se houver problema.',a:[['Pronto',()=>{setMedia('SSD 1');clear()}],['Gravando',()=>{setMedia('SSD 1');active('rec')}],['Reproduzindo',()=>{setMedia('SSD 1');active('play')}],['Problema',()=>{setMedia('SSD 1');glow('#g1','bad')}]]},
ssd2:{t:'Compartimento SSD 2',term:'SSD 2,5 polegadas',f:'O segundo SSD oferece outra mídia disponível sem remover o primeiro disco.',e:'Em uma sessão longa, você pode preparar um segundo SSD e alternar a mídia usada pelo deck.',a:[['Selecionar SSD 2',()=>setMedia('SSD 2')],['Gravando',()=>{setMedia('SSD 2');active('rec')}],['Problema',()=>{setMedia('SSD 2');glow('#g2','bad')}]]},
sd:{t:'Cartão SD',term:'SD / UHS-II',f:'O slot vertical recebe um cartão SD compatível para gravação e reprodução.',e:'Um cartão SD pode ser útil para VTs, testes ou gravações menores, desde que tenha desempenho suficiente para o formato escolhido.',a:[['Selecionar SD',()=>setMedia('SD')],['Gravando',()=>{setMedia('SD');active('rec')}],['Reproduzindo',()=>{setMedia('SD');active('play')}],['Problema',()=>{setMedia('SD');glow('#gsd','bad')}]]},
menu:{t:'Menu de configurações',term:'SEARCH / MENU / SET',f:'MENU abre as configurações, o seletor ou os botões SKIP percorrem opções e SET confirma uma escolha.',e:'Antes de gravar, use o menu para conferir entrada, codec e outras opções do deck.',a:[['Abrir menu',()=>{$('#tc').textContent='MENU';$('#preview').textContent='ENTRADA '+input+' • CODEC H.264/5'}],['Tela inicial',()=>{upd();$('#preview').textContent='INPUT '+input}]]},
lcd:{t:'Tela de monitoramento',term:'LCD 2,2 polegadas',f:'O LCD mostra vídeo, timecode, formato, estado, mídia ativa e níveis de áudio.',e:'Antes de uma gravação, confira se a entrada e o formato estão corretos. Durante a operação, acompanhe timecode, mídia e medidores.',a:[['Entrada SDI',()=>setInput('SDI')],['Entrada HDMI',()=>setInput('HDMI')],['Pouco espaço',()=>$('#tc').setAttribute('fill','#ef4444')],['Normal',()=>$('#tc').setAttribute('fill','#fff')]]},
search:{t:'Modos de busca',term:'STL / JOG / SCR',f:'Esses botões definem como o grande seletor percorre o material.',e:'JOG é ideal para chegar exatamente a um quadro. STL usa velocidade variável. SCR percorre rapidamente um clipe longo.',a:[['JOG',()=>setMode('JOG')],['STL',()=>setMode('STL')],['SCR',()=>setMode('SCR')]]},
dial:{t:'Seletor de busca',term:'Search Dial',f:'O seletor move o ponto de reprodução conforme o modo de busca ativo.',e:'Use JOG para marcar o primeiro quadro de um VT. Em STL ou SCR, um giro maior percorre uma quantidade maior de conteúdo.',a:[['Girar à esquerda',()=>{angle-=45;$('#dm').setAttribute('transform','rotate('+angle+' 1180 111)');frames=Math.max(0,frames-(mode==='JOG'?1:mode==='STL'?90:300));upd()}],['Girar à direita',()=>{angle+=45;$('#dm').setAttribute('transform','rotate('+angle+' 1180 111)');frames+=mode==='JOG'?1:mode==='STL'?90:300;upd()}]]},
audio:{t:'Monitoramento de áudio',term:'Speaker / Headphones',f:'O alto-falante frontal e a saída para fones permitem ouvir rapidamente o áudio do sinal ou arquivo.',e:'Antes de colocar um VT no ar, escute alguns segundos para confirmar que o áudio realmente existe, além de observar os medidores.',a:[['Monitorar áudio',()=>{}],['Silenciar',()=>{}]]}};
function show(k){let l=L[k]||L.transport;$$('.spot').forEach(x=>x.classList.toggle('sel',x.dataset.k===k));$('#title').textContent=l.t;$('#term').textContent='('+l.term+')';$('#func').textContent=l.f;$('#ex').textContent=l.e;let b=$('#buttons');b.innerHTML='';l.a.forEach((a,i)=>{let x=document.createElement('button');x.className='sim';x.textContent=a[0];x.onclick=()=>{[...b.children].forEach(y=>y.classList.remove('active'));x.classList.add('active');a[1]();$('#feedback').textContent=a[0]+' aplicado ao painel.'};b.appendChild(x);if(i===0)setTimeout(()=>x.click(),0)})}
$$('.spot').forEach(x=>x.onclick=()=>show(x.dataset.k));show('transport')})();</script></main></body></html>
