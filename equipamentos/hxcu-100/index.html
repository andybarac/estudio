*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}main{max-width:1180px;margin:auto;padding:20px}.lead{color:var(--muted);line-height:1.55}.toolbar{display:flex;justify-content:flex-end;margin:12px 0}.btn,.sim{background:transparent;color:var(--text);border:1px solid #424b54;border-radius:9px;padding:10px 13px;cursor:pointer}.sim.active{background:var(--accentbg);border-color:var(--accent);font-weight:650}.frame{overflow-x:auto;border:1px solid #3d464f;border-radius:14px;background:#14191e;padding:12px}.frame svg{width:100%;min-width:930px}.spot{cursor:pointer;outline:none}.hit{fill:transparent;stroke:transparent;stroke-width:2}.spot.selected .hit{stroke:var(--accent);fill:var(--accentbg);fill-opacity:.15}.led{transition:fill .18s,opacity .18s,filter .18s}.led-off{fill:var(--off);opacity:.28}.led-red{fill:var(--red);filter:drop-shadow(0 0 5px var(--red))}.led-green{fill:var(--green);filter:drop-shadow(0 0 5px var(--green))}.led-amber{fill:var(--amber);filter:drop-shadow(0 0 5px var(--amber))}.blink-red{fill:var(--red);filter:drop-shadow(0 0 5px var(--red));animation:blink .72s steps(1,end) infinite}.blink-green{fill:var(--green);filter:drop-shadow(0 0 5px var(--green));animation:blink .72s steps(1,end) infinite}.paneltext{fill:#d9dde1;font-size:5.3px;text-anchor:middle}.micro{fill:#aeb6bd;font-size:4.2px;text-anchor:middle}.move{transition:transform .2s ease}.lesson{margin-top:16px;border:1px solid #3d464f;border-radius:14px;background:var(--card);padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted);font-weight:700}.copy{line-height:1.6;color:var(--text);font-size:14px}.term{color:var(--muted);font-size:14px;margin-top:4px}.modes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.feedback{margin-top:12px;background:var(--panel);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start}.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:0 0 auto}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.1}}@media(max-width:700px){main{padding:14px}.row{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.blink-red,.blink-green{animation:none}.move{transition:none}}

<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let controlAngle=0;const setLed=(id,cls)=>$(id).setAttribute('class','led '+cls),move=(id,y)=>$(id).setAttribute('transform','translate(0 '+y+')'),rot=(id,cx,cy,a)=>$(id).setAttribute('transform','rotate('+a+' '+cx+' '+cy+')');
function defaults(){setLed('#tallyLed','led-off');setLed('#openLed','led-off');setLed('#shortLed','led-off');setLed('#camLed','led-green');setLed('#mainLed','led-green');setLed('#networkLed','led-green');setLed('#menuLed','led-off');move('#powerHandle',0);move('#micHandle',0);move('#intercomHandle',0);move('#displayHandle',0);move('#enterHandle',0);rot('#levelMark',269,80,0);rot('#controlMark',438,122,0);controlAngle=0}
const lessons={
tally:{t:'Luz de programa',term:'Tally',f:'Essa luz informa um estado enviado pelo sistema de produção. Ela pode ficar vermelha ou verde e permite reconhecer rapidamente o estado da câmera.',e:'Durante um programa ao vivo, a luz vermelha normalmente ajuda a identificar que a imagem daquela câmera está sendo utilizada. A luz verde pode representar outro estado definido pelo sistema de tally.',m:[['Apagada','Nenhum sinal de tally está sendo recebido.','off',()=>setLed('#tallyLed','led-off')],['Vermelha','A CCU está recebendo um sinal de tally vermelho.','red',()=>setLed('#tallyLed','led-red')],['Verde','A CCU está recebendo um sinal de tally verde.','green',()=>setLed('#tallyLed','led-green')]]},
alarm:{t:'Alarme do cabo da câmera',term:'Cable Alarm',f:'As luzes OPEN e SHORT ajudam a descobrir problemas na ligação triax entre a câmera e a CCU.',e:'Se a câmera deixa de funcionar, OPEN pode indicar falta de conexão ou falha de transmissão. SHORT indica uma condição elétrica de sobrecorrente.',m:[['Normal','A conexão não apresenta um alarme de cabo.','green',()=>{setLed('#openLed','led-off');setLed('#shortLed','led-off')}],['OPEN aceso','A câmera não está conectada ao circuito triax.','red',()=>{setLed('#openLed','led-red');setLed('#shortLed','led-off');setLed('#camLed','led-off')}],['OPEN piscando','Existe um problema de transmissão entre câmera e CCU.','red',()=>{setLed('#openLed','blink-red');setLed('#shortLed','led-off')}],['SHORT aceso','A CCU detectou sobrecorrente ou curto e interrompe a alimentação da câmera.','red',()=>{setLed('#openLed','led-off');setLed('#shortLed','led-red');setLed('#camLed','led-off')}]]},
power:{t:'Liga e desliga',term:'Power',f:'Essa chave liga ou desliga o sistema ligado à CCU.',e:'Antes de uma aula ou gravação, esse comando participa da inicialização. Desligá-lo durante a operação pode retirar a câmera do sistema.',m:[['Ligado','O sistema está energizado.','green',()=>{move('#powerHandle',0);setLed('#mainLed','led-green');setLed('#camLed','led-green')}],['Desligado','A alimentação foi desligada.','off',()=>{move('#powerHandle',12);setLed('#mainLed','led-off');setLed('#camLed','led-off');setLed('#networkLed','led-off')}]]},
powerlights:{t:'Indicadores de alimentação',term:'CAM e MAIN',f:'MAIN mostra que a CCU está ligada. CAM mostra que a câmera está recebendo alimentação.',e:'Se MAIN está aceso e CAM apagado, a CCU tem energia, mas a câmera pode não estar sendo alimentada. Se MAIN pisca, o manual indica problema no ventilador.',m:[['Tudo normal','CCU ligada e câmera alimentada.','green',()=>{setLed('#mainLed','led-green');setLed('#camLed','led-green')}],['Sem câmera','A CCU continua ligada, mas a câmera não recebe alimentação.','amber',()=>{setLed('#mainLed','led-green');setLed('#camLed','led-off')}],['Falha de ventilação','MAIN pisca para indicar problema no ventilador da CCU.','red',()=>{setLed('#mainLed','blink-green');setLed('#camLed','led-green')}]]},
level:{t:'Volume da comunicação',term:'Intercom Level',f:'Esse botão giratório ajusta o volume ouvido no headset.',e:'Se o operador ouve a equipe, mas o volume está baixo, este controle pode ser ajustado sem alterar o volume dos outros participantes.',m:[['Baixo','Nível de escuta reduzido.','off',()=>rot('#levelMark',269,80,-55)],['Médio','Nível intermediário.','green',()=>rot('#levelMark',269,80,0)],['Alto','Nível de escuta elevado.','amber',()=>rot('#levelMark',269,80,55)]]},
micpgm:{t:'Microfone e programa',term:'MIC / PGM',f:'MIC ON liga o microfone, OFF o desliga e PGM seleciona a escuta do áudio de programa.',e:'MIC ON permite falar com a equipe. OFF é útil quando se deseja apenas ouvir. PGM permite ouvir o programa e ajustar seu nível.',m:[['MIC ON','O microfone está ligado.','green',()=>move('#micHandle',0)],['OFF','O microfone está desligado.','off',()=>move('#micHandle',10)],['PGM','O controle de nível passa a ajustar o áudio de programa ouvido no headset.','amber',()=>move('#micHandle',20)]]},
intercom:{t:'Escolha da comunicação',term:'PROD / PRIV / ENG',f:'Essa chave escolhe a linha de comunicação usada pelo headset.',e:'PROD pode ser usado para falar com produção, ENG com a equipe técnica e PRIV para comunicação privada entre CCU e câmera.',m:[['PROD','Comunicação conectada à produção.','green',()=>move('#intercomHandle',0)],['PRIV','Produção e engenharia são isoladas para comunicação privada.','amber',()=>move('#intercomHandle',10)],['ENG','Comunicação conectada à engenharia.','green',()=>move('#intercomHandle',20)]]},
headset:{t:'Conexão do headset',term:'Intercom XLR de 5 pinos',f:'Esse conector recebe o fone com microfone usado na comunicação interna.',e:'Se o operador não ouve ninguém ou seu microfone não funciona, conferir o encaixe do headset é uma das primeiras verificações.',m:[['Conectado','O headset pode participar da comunicação.','green',()=>{}],['Desconectado','Sem headset, esta conexão frontal não permite ouvir e falar.','off',()=>{}]]},
display:{t:'Tela de estado e menu',term:'DISP / MENU',f:'Essa chave alterna entre informações de estado e o menu de configuração.',e:'DISP permite consultar diagnósticos. MENU é usado quando algum parâmetro da CCU precisa ser configurado.',m:[['DISP','A CCU apresenta as telas de estado.','green',()=>{move('#displayHandle',0);setLed('#menuLed','led-off')}],['MENU','A CCU entra no modo de configuração.','amber',()=>{move('#displayHandle',20);setLed('#menuLed','led-amber')}]]},

function dot(k){const c={off:'var(--off)',red:'var(--red)',green:'var(--green)',amber:'var(--amber)'};$('#simDot').style.background=c[k]||c.off;$('#simDot').style.opacity=k==='off'?'.4':'1';$('#simDot').style.boxShadow=k==='off'?'none':'0 0 8px '+(c[k]||c.off)}
function show(k){const l=lessons[k];$$('.spot').forEach(s=>s.classList.toggle('selected',s.dataset.key===k));$('#partTitle').textContent=l.t;$('#partTerm').textContent='('+l.term+')';$('#partFunction').textContent=l.f;$('#partExample').textContent=l.e;const box=$('#simButtons');box.innerHTML='';l.m.forEach((m,i)=>{const b=document.createElement('button');b.className='sim';b.textContent=m[0];b.onclick=()=>{[...box.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');m[3]();$('#simText').textContent=m[1];dot(m[2])};box.appendChild(b);if(i===0)setTimeout(()=>b.click(),0)})}
$$('.spot').forEach(s=>{s.onclick=()=>show(s.dataset.key);s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(s.dataset.key)}}});$('#reset').onclick=()=>{defaults();show('tally')};defaults();show('tally')})();

<script id="ubq-mobile-layer">
(()=>{
  const one=(s,r=document)=>r.querySelector(s);
  const all=(s,r=document)=>[...r.querySelectorAll(s)];
  const candidates=all('.lesson,.side,.experiment').filter(el=>{
    if(el.closest('.modal')) return false;
    return !!el.querySelector('h2,[id*="Title"],[id*="title"],.eyebrow,.ey,.copy,.intro');
  });
  if(!candidates.length) return;
  const panel=candidates[candidates.length-1];
  panel.classList.add('ubq-context');

  const backdrop=document.createElement('div');
  backdrop.className='ubq-context-backdrop';
  document.body.appendChild(backdrop);

  const close=document.createElement('button');
  close.type='button';
  close.className='ubq-close';
  close.innerHTML='×';
  close.setAttribute('aria-label','Fechar explicação');
  close.title='Fechar';
  panel.prepend(close);

  function placePanel(trigger){
    const r=trigger?.getBoundingClientRect?.();
    const vh=window.innerHeight;
    if(!r){panel.style.top='';panel.style.bottom='14px';return}
    const triggerMid=r.top+r.height/2;
    const preferTop=triggerMid>vh*.52;
    if(preferTop){
      panel.style.top='10px';
      panel.style.bottom='auto';
    }else{
      panel.style.top='auto';
      panel.style.bottom='10px';
    }
  }

  const openContext=(trigger)=>{
    placePanel(trigger);
    panel.classList.add('open');
    backdrop.classList.add('open');
    document.body.classList.add('ubq-context-open');
    panel.scrollTop=0;
  };
  const closeContext=()=>{
    panel.classList.remove('open');
    backdrop.classList.remove('open');
    document.body.classList.remove('ubq-context-open');
  };

  close.addEventListener('click',e=>{e.stopPropagation();closeContext()});
  backdrop.addEventListener('click',closeContext);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeContext()});

  const triggerSelector='.spot,.control,.ctl,.zone,[data-key],[data-control],[data-part],[data-zone],[data-id],[data-mode]';
  document.addEventListener('click',e=>{
    if(e.target.closest('.ubq-context')) return;
    const trigger=e.target.closest(triggerSelector);
    if(trigger) requestAnimationFrame(()=>openContext(trigger));
  },true);

  window.addEventListener('resize',()=>{
    if(panel.classList.contains('open')) panel.style.maxHeight=Math.min(window.innerHeight*.46,520)+'px';
  });

  const iconMap=[
    [/restaurar|reset/i,'↺'],
    [/painel inteiro|ver painel|full panel/i,'⛶'],
    [/fechar|close/i,'×'],
    [/nova aba|abrir página|abrir em nova/i,'↗']
  ];
  all('button,.btn,a.btn').forEach(el=>{
    const txt=(el.dataset.ubqLabel||el.textContent||'').trim();
    for(const [re,icon] of iconMap){
      if(re.test(txt)&&txt.length>5){
        el.dataset.ubqLabel=txt;el.textContent=icon;el.classList.add('ubq-icon-btn');
        el.setAttribute('aria-label',txt);el.title=txt;break;
      }
    }
  });

  const lead=one('.lead');
  if(lead&&!lead.classList.contains('ubq-lead-after')){
    const anchor=one('.layout')||one('.frame')||one('.instrument')||one('.panelScroller')||one('.stage');
    if(anchor&&anchor.parentNode){anchor.insertAdjacentElement('afterend',lead);lead.classList.add('ubq-lead-after')}
  }
})();
</script>
